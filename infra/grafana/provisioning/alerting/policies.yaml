apiVersion: 1

policies:
  - orgId: 1
    receiver: operator-webhook
    group_by:
      - alertname
      - machine_id
    # A19: a notification leaves at once for a new alert, and a further alert of
    # the group follows within ten seconds.
    group_wait: 0s
    group_interval: 10s
    repeat_interval: 1h
