# Local development stack of the prototype (ADR-0013). The credentials are the
# documented development defaults and protect nothing beyond this machine; every
# port is bound to the loopback interface for the same reason.
name: bladewatch

services:
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two listeners for clients: HOST for the processes on the developer
      # machine and INTERNAL for the other containers, because a broker has
      # to advertise an address that the client can reach.
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # A8: a single node, so every internal topic has one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The topics are created by kafka-init with their configuration, so a
      # misspelled topic name fails instead of creating a new topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # One-shot job. It exits with status 0 after the topics exist, and is the
  # only container of the stack that is not expected to keep running.
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        topics=/opt/kafka/bin/kafka-topics.sh
        # ADR-0011: the broker sets the time of arrival.
        # ADR-0014: partitions and retention are the assumptions A10 and A11.
        $$topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic machine-temperature --partitions 6 --replication-factor 1 \
          --config retention.ms=604800000 \
          --config message.timestamp.type=LogAppendTime
        $$topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic machine-alerts --partitions 3 --replication-factor 1 \
          --config retention.ms=604800000 \
          --config message.timestamp.type=LogAppendTime

  timescaledb:
    image: timescale/timescaledb:2.30.2-pg17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: bladewatch
      POSTGRES_PASSWORD: bladewatch
      POSTGRES_DB: bladewatch
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      # Run once, in file name order, when the data volume is empty.
      - ./infra/timescaledb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # The TCP address is checked on purpose. During the initialisation the
      # image runs a temporary server that listens on the socket only, and a
      # check over the socket would report healthy before the schema exists.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bladewatch -d bladewatch"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  grafana:
    image: grafana/grafana:13.2.4
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: bladewatch
      GF_USERS_ALLOW_SIGN_UP: "false"
      # A18: the dashboard refreshes every second, which is below the default
      # lower limit of five seconds.
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
    extra_hosts:
      # The contact point posts to the receiver on the host. Docker Desktop
      # defines this name itself, and Linux needs the mapping.
      - "host.docker.internal:host-gateway"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  kafka-data:
  timescaledb-data:
  grafana-data:
